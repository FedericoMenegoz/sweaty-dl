name: Build deployment profiles
on:
  workflow_dispatch:
  push:
    branches: ['deployment']
    tags: ['v*']
permissions:
  contents: read
# Serialize version selection, builds, and publishing together. Queue pushes
# instead of replacing pending releases. Build-only runs have their own groups.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deployment' && 'deployment-release' || format('deployment-build-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  profiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      tag: ${{ steps.release.outputs.tag }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require completed release setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [ "$RELEASE_ENABLED" != true ]; then
            echo '::error::Complete docs/releases.md setup and platform verification before setting RELEASE_ENABLED=true.'
            exit 1
          fi
      - name: Determine release version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh prepare
      - id: targets
        shell: bash
        run: |
          set -euo pipefail
      
          matrix="$(python3 -B scripts/deploy.py --matrix)"
      
          if [ -z "$matrix" ]; then
            echo "::error::Deployment matrix is empty"
            exit 1
          fi
      
          echo "$matrix" | python3 -m json.tool > /dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Deployment matrix: $matrix"
  build:
    needs: profiles
    if: needs.profiles.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_NET_OFFLINE: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Set application version in the build checkout
        if: needs.profiles.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ needs.profiles.outputs.tag }}
        run: python -B scripts/release_version.py apply "$RELEASE_TAG"
        shell: bash
      - name: Install backend build dependencies
        run: python -m pip install -r deployment/requirements-build.txt
      - name: Install FFprobe on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFprobe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffprobe = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffprobe) { throw 'Actual FFprobe binary not found; do not bundle a Chocolatey shim.' }
          "SWEATYDL_FFPROBE=$($ffprobe.FullName)" >> $env:GITHUB_ENV
      - name: Install Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 ffmpeg gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: npm ci
      - run: npm test
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the matching deployment profile
        env:
          DEPLOYMENT_PROFILE: ${{ matrix.profile }}
          SWEATYDL_RELEASE_BUILD: '1'
        shell: bash
        run: python -B scripts/deploy.py --target "$DEPLOYMENT_PROFILE" --updater
      - name: Stage verified native packages
        env:
          DEPLOYMENT_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: python -B scripts/updater_manifest.py --stage-build "$DEPLOYMENT_PROFILE" --source deployments --assets workflow-artifacts --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SweatyDL-${{ matrix.profile }}
          path: workflow-artifacts/
          if-no-files-found: error
          overwrite: true
  sign:
    needs: [profiles, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - name: Install signing tools without project lifecycle scripts
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: SweatyDL-*
          path: deployments
      - name: Sign and verify update packages
        env:
          TAG: ${{ needs.profiles.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 -B scripts/sign_release.py --tag "$TAG" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: signed-deployments/
          if-no-files-found: error
          overwrite: true
  release:
    needs: [profiles, sign]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: deployments
      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.profiles.outputs.tag }}
        run: bash scripts/release.sh publish
